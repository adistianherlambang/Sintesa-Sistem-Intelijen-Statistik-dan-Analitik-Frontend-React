name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy & Build Frontend
        run: |
          rsync -a --delete --exclude='.env' --exclude='node_modules' --exclude='build' ./ /var/www/sintesa/frontend/
          cd /var/www/sintesa/frontend
          npm ci --legacy-peer-deps
          GENERATE_SOURCEMAP=false NODE_OPTIONS="--max-old-space-size=2560" npm run build
          sudo systemctl reload nginx
